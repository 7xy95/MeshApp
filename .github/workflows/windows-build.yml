name: Windows Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - run: npm install @sylphx/webgpu-win32-x64-msvc@1.0.4 --save-optional

      - run: npm run make -- --platform=win32 --arch=x64

      - uses: actions/upload-artifact@v4
        with:
          name: Mesh-win32-x64
          path: out/**
